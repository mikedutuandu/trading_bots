# Railway / Nixpacks build config for the Binance bot.
#
# Railway service settings: Root Directory = repo root (the bot moved to the root 2026-06-12 —
# if the service was previously set to "binance_bot", CLEAR that setting or deploys will fail).
# (so this file + package.json are found, and Node 20 gets provisioned).
#
# The app runs the TypeScript sources DIRECTLY via tsx — there is NO compile step,
# so the default `npm run build` (tsc) is replaced with a no-op here.
#
# Set the actual process in Railway → Settings → Deploy → Custom Start Command, e.g.:
#   npm run live                # trend-pullback engine (mainnet, gated by ALLOW_LIVE+CONFIRM_LIVE)
#   npm run testnet             # demo forward-test
# (the line below is just the default if no custom start command is set.)

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["true"] # no build — tsx runs the .ts sources directly

[start]
cmd = "npm run live"
